# AIOX Squad Manifest — ecommerce-growth
# Schema: .aiox-core/schemas/squad-schema.json
name: ecommerce-growth
version: 1.0.0
short-title: Ecommerce Growth Squad
description: >-
  Operação de growth para e-commerce: pesquisa de produto e mercado,
  estratégia de oferta, copywriting, landing pages, Shopify, criativos,
  CRO, QA e lançamento de testes. Orquestração AIOX + execução Hermes.
author: Homefy
license: UNLICENSED

slashPrefix: growth

aiox:
  minVersion: 5.4.1
  type: squad

requires:
  node: ">=18.0.0"
  aiox: ">=5.4.1"

tags:
  - ecommerce
  - shopify
  - dropshipping
  - cro
  - copywriting

# Task-first: tasks são o ponto de entrada primário.
# Product Brief (templates/product-brief.md) é o contrato de entrada central:
# todos os agents consomem o mesmo contexto estruturado do produto.
components:
  tasks:
    - research-product.md
    - research-market.md
    - analyze-competitors.md
    - create-customer-avatar.md
    - create-offer.md
    - create-positioning.md
    - create-copy.md
    - create-page-spec.md
    - build-landing-page.md
    - build-shopify-page.md
    - generate-creative-brief.md
    - audit-page.md
    - audit-cro.md
    - audit-shopify.md
    - prepare-launch.md
    - smoke-test-project-structure.md
  agents:
    - ecommerce-master.md
    - market-researcher.md
    - product-researcher.md
    - offer-strategist.md
    - copywriter.md
    - ux-designer.md
    - shopify-engineer.md
    - creative-director.md
    - cro-specialist.md
    - qa-specialist.md
  workflows:
    - product-to-page.yaml
    - product-to-launch.yaml
    - page-optimization.yaml
  checklists:
    - copy.md
    - ux.md
    - shopify.md
    - performance.md
    - cro.md
    - launch.md
  templates:
    - product-brief.md
    - research-report.md
    - offer-brief.md
    - landing-page-spec.md
    - creative-brief.md
    - qa-report.md
    - launch-report.md
  tools:
    - validate-squad.js

config:
  extends: extend
  coding-standards: config/coding-standards.md
  tech-stack: config/tech-stack.md
  source-tree: config/source-tree.md

integration:
  executor: workflows/executors/hermes-exec.sh
  executor_contract: .aiox/external-runs/
  execution_runtime: hermes
  publish_requires_human_approval: true
