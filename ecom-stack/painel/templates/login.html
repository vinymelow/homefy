<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Homefy</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="auth"><main class="auth-card"><p class="eyebrow">HOMEFY OPERATING SYSTEM</p><h1>Centro de comando</h1>
<p class="muted">Acesso privado ao seu e-commerce, agentes e workflows.</p>
{% if needs_setup %}<p class="nota">A conta administradora ainda não foi inicializada.</p>{% endif %}
{% if error %}<p class="erro">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack"><input type="hidden" name="next" value="{{ next }}">
<label>E-mail<input type="email" name="email" autocomplete="username" required></label>
<label>Senha<input type="password" name="password" autocomplete="current-password" required></label>
<label>Código do autenticador ou recuperação<input name="code" inputmode="numeric" autocomplete="one-time-code"></label>
<button class="botao grande" type="submit">Entrar com segurança</button></form></main></body></html>
