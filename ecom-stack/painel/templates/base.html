<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Homefy{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="marca" href="/">Homefy <span>OS</span></a>
  <nav>
    <a href="/">Visão geral</a><a href="/novo">Produtos</a><a href="/chat">Chat</a><a href="/aprovacoes">Aprovações</a>
    <a href="/ativos">Ativos</a>
    <a href="/auditoria">Auditoria</a>
  </nav>
  {% if session %}<form method="post" action="/logout"><button class="link" type="submit">Sair</button></form>{% endif %}
</header>
<main>
{% block conteudo %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
